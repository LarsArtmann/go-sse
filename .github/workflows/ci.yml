name: CI

on:
  push:
    branches: [master]
  pull_request:

# Rapid pushes waste runner minutes running superseded jobs to completion;
# each new push/PR update cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./... -race -count=1
      # ssetest is a separate Go module (resolved via its replace directive);
      # GOWORK=off keeps it out of any ambient workspace.
      - run: go test ./... -race -count=1
        working-directory: ssetest
        env:
          GOWORK: off

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pin to the SAME version nixpkgs ships (`pkgs.golangci-lint` in
          # flake.nix — currently 2.13.2) so local and CI lint agree; a skew
          # let a goconst counting difference between 2.12 and 2.13 pass
          # locally and fail CI. scripts/verify.sh cross-checks this pin
          # against the local binary. Also built with a recent Go, which is
          # required because go.mod's `go` directive is 1.27.1. `version:
          # latest` resolved to v1.64.8 (built with Go 1.24) inside the
          # action's vendored fallback, which then refuses to load the config
          # with:
          #   "the Go language version (go1.24) used to build golangci-lint
          #    is lower than the targeted Go version"
          # We also need action v7 because v6 refuses golangci-lint v2
          # versions entirely ("golangci-lint v2 is not supported by
          # golangci-lint-action v6").
          version: v2.13.2
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: ssetest
        env:
          GOWORK: "off"

  vet:
    name: Vet
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go vet ./...
        working-directory: ssetest
        env:
          GOWORK: off

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Scope coverage to the sse package only (.), excluding example/ which is
      # demonstration code, not library logic under test.
      - run: go test . -coverprofile=coverage.out -covermode=atomic
      - run: go tool cover -func=coverage.out
      - run: go test ./... -coverprofile=ssetest-coverage.out -covermode=atomic
        working-directory: ssetest
        env:
          GOWORK: off
      - run: go tool cover -func=ssetest-coverage.out
        working-directory: ssetest

  examples:
    name: Examples
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # CI previously compiled only root + ssetest; a broken example or a stale
      # index_templ.go shipped unnoticed.
      - run: go build ./example/...
      # @version form (not module mode): templ's cmd needs extra deps that are
      # intentionally absent from go.sum; the version stays pinned to the
      # dependency the examples were generated with.
      - run: go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate -check

  smoke:
    name: Example smoke
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Compile-only coverage of the examples cannot catch a dead handler, a
      # wrong port, or a startup panic — boot each example and require real
      # SSE bytes (scripts/smoke-examples.sh).
      - run: scripts/smoke-examples.sh

  nix:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # The hermetic gate: builds root + ssetest with the flake's own
      # toolchain and vendor hashes — this is the check that catches
      # vendorHash drift raw `go test` cannot see.
      - run: nix flake check

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned to v1.7.0: the lint job documents why `latest` is unacceptable
      # one job above; vulncheck must not repeat that anti-pattern.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...
      - run: govulncheck ./...
        working-directory: ssetest
        env:
          GOWORK: off

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Each fuzz target gets its own run: -fuzz matches exactly one target,
      # so one invocation per target with -fuzztime=1m each.
      - run: go test . -fuzz=FuzzWriteEvent -fuzztime=1m
      - run: go test . -fuzz=FuzzParseEventID -fuzztime=1m
      # FuzzKeyedLines pins the DataStar keyed-data-line building block.
      - run: go test . -fuzz=FuzzKeyedLines -fuzztime=1m
      - run: go test . -fuzz=FuzzReadEvents -fuzztime=1m
        working-directory: ssetest
        env:
          GOWORK: off
      # The write→read round-trip is the conformance contract; it must fuzz
      # in CI like every other property.
      - run: go test . -fuzz=FuzzWriteReadRoundTrip -fuzztime=1m
        working-directory: ssetest
        env:
          GOWORK: off
      # The line splitter behind the reader (internal target, same package).
      - run: go test . -fuzz=FuzzSplitSSELines -fuzztime=1m
        working-directory: ssetest
        env:
          GOWORK: off
