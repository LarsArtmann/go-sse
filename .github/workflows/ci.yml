name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -race -count=1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          # Pin to v2.12.2 — matches `pkgs.golangci-lint` in flake.nix
          # (nixpkgs unstable) and is built with Go 1.26.5, which is required
          # because go.mod's `go` directive is 1.26.5. `version: latest`
          # resolved to v1.64.8 (built with Go 1.24) inside the action's
          # vendored fallback, which then refuses to load the config with:
          #   "the Go language version (go1.24) used to build golangci-lint
          #    is lower than the targeted Go version (1.26.5)"
          # We also need action v7 because v6 refuses golangci-lint v2
          # versions entirely ("golangci-lint v2 is not supported by
          # golangci-lint-action v6").
          version: v2.12.2

  vet:
    name: Vet
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Scope coverage to the sse package only (.), excluding example/ which is
      # demonstration code, not library logic under test.
      - run: go test . -coverprofile=coverage.out -covermode=atomic
      - run: go tool cover -func=coverage.out

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Each fuzz target gets its own run: -fuzz matches exactly one target,
      # so one invocation per target with -fuzztime=1m each.
      - run: go test . -fuzz=FuzzWriteEvent -fuzztime=1m
      - run: go test . -fuzz=FuzzParseEventID -fuzztime=1m
