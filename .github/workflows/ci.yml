name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test ./... -race -count=1
      # ssetest is a separate Go module (resolved via its replace directive);
      # GOWORK=off keeps it out of any ambient workspace.
      - run: go test ./... -race -count=1
        working-directory: ssetest
        env:
          GOWORK: off

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          # Pin to v2.12.2 — matches `pkgs.golangci-lint` in flake.nix
          # (nixpkgs unstable) and is built with a recent Go, which is required
          # because go.mod's `go` directive is 1.26.6. `version: latest`
          # resolved to v1.64.8 (built with Go 1.24) inside the action's
          # vendored fallback, which then refuses to load the config with:
          #   "the Go language version (go1.24) used to build golangci-lint
          #    is lower than the targeted Go version (1.26.6)"
          # We also need action v7 because v6 refuses golangci-lint v2
          # versions entirely ("golangci-lint v2 is not supported by
          # golangci-lint-action v6").
          version: v2.12.2
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2
          working-directory: ssetest
        env:
          GOWORK: "off"

  vet:
    name: Vet
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go vet ./...
        working-directory: ssetest
        env:
          GOWORK: off

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # Scope coverage to the sse package only (.), excluding example/ which is
      # demonstration code, not library logic under test.
      - run: go test . -coverprofile=coverage.out -covermode=atomic
      - run: go tool cover -func=coverage.out
      - run: go test ./... -coverprofile=ssetest-coverage.out -covermode=atomic
        working-directory: ssetest
        env:
          GOWORK: off
      - run: go tool cover -func=ssetest-coverage.out
        working-directory: ssetest

  examples:
    name: Examples
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # CI previously compiled only root + ssetest; a broken example or a stale
      # index_templ.go shipped unnoticed.
      - run: go build ./example/...
      # @version form (not module mode): templ's cmd needs extra deps that are
      # intentionally absent from go.sum; the version stays pinned to the
      # dependency the examples were generated with.
      - run: go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate -check

  nix:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # The hermetic gate: builds root + ssetest with the flake's own
      # toolchain and vendor hashes — this is the check that catches
      # vendorHash drift raw `go test` cannot see.
      - run: nix flake check

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # Pinned to v1.7.0: the lint job documents why `latest` is unacceptable
      # one job above; vulncheck must not repeat that anti-pattern.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...
      - run: govulncheck ./...
        working-directory: ssetest
        env:
          GOWORK: off

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # Each fuzz target gets its own run: -fuzz matches exactly one target,
      # so one invocation per target with -fuzztime=1m each.
      - run: go test . -fuzz=FuzzWriteEvent -fuzztime=1m
      - run: go test . -fuzz=FuzzParseEventID -fuzztime=1m
      # FuzzKeyedLines pins the DataStar keyed-data-line building block.
      - run: go test . -fuzz=FuzzKeyedLines -fuzztime=1m
      - run: go test . -fuzz=FuzzReadEvents -fuzztime=1m
        working-directory: ssetest
        env:
          GOWORK: off
      # The write→read round-trip is the conformance contract; it must fuzz
      # in CI like every other property.
      - run: go test . -fuzz=FuzzWriteReadRoundTrip -fuzztime=1m
        working-directory: ssetest
        env:
          GOWORK: off
      # The line splitter behind the reader (internal target, same package).
      - run: go test . -fuzz=FuzzSplitSSELines -fuzztime=1m
        working-directory: ssetest
        env:
          GOWORK: off
