name: Flake update

# Weekly dependency-drift catcher: bump flake.lock inputs, run the full
# hermetic gate on the bumped tree, and open a PR with the diff. Without a
# schedule, input drift is only noticed when someone bumps manually.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  flake-update:
    name: Update flake.lock and gate it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update flake inputs
        run: nix flake update
      - name: Detect input drift
        id: drift
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The gate must run HERE, not on the PR: PRs opened with GITHUB_TOKEN
      # never trigger pull_request workflows (GitHub's recursion guard), so
      # the PR itself would show no checks at all. Same command as the CI
      # `nix` job.
      - name: Full gate on updated inputs
        id: gate
        if: steps.drift.outputs.changed == 'true'
        continue-on-error: true
        run: nix flake check
      # nix flake check does NOT compare the golangci-lint version the updated
      # nixpkgs ships against the pin in ci.yml - the 2.13.2 -> 2.14.0 nixpkgs
      # bump shipped silently through this workflow, and every later push
      # failed the verify.sh skew check. Catch the drift here, where the fix
      # belongs (the same PR), instead of on the next human push.
      - name: golangci-lint pin cross-check
        id: pin
        if: steps.drift.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          pin="$(scripts/golangci-pin.sh)"
          nix_version="v$(nix develop .#ci -c golangci-lint version --short)"
          if [[ "$nix_version" != "$pin" ]]; then
            echo "FAIL: nixpkgs golangci-lint ($nix_version) drifted from the ci.yml pin ($pin)." >&2
            echo "      Bump every 'version:' line in .github/workflows/ci.yml to $nix_version in this PR." >&2
            exit 1
          fi
          echo "golangci-lint pin matches the updated nixpkgs ($pin)"
      # Runs even when the gate failed (always()) so the failing diff is
      # reviewable in a PR, not only in the red run's logs.
      - name: Close superseded update PRs
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Weekly runs pile up open PRs if old ones linger; the PR opened
          # below supersedes every previous automated update PR.
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("chore/flake-update-")) | .number' \
            | while read -r number; do
                gh pr close "$number" \
                  --comment "Superseded by today's automated flake-update run." \
                  --delete-branch
              done
      - name: Open update PR
        if: always() && steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          date="$(date -u +%Y-%m-%d)"
          branch="chore/flake-update-$date"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add flake.lock
          git commit -m "chore(nix): weekly flake update $date"
          git push origin "$branch"
          gate="${{ steps.gate.outcome }}"
          pin="${{ steps.pin.outcome }}"
          body="Automated weekly \`nix flake update\` run (Mondays 04:00 UTC).
          In-workflow gate (\`nix flake check\`) outcome: ${gate}.
          golangci-lint pin cross-check outcome: ${pin}.
          This PR shows no CI checks because GITHUB_TOKEN-opened PRs do not trigger workflows.
          If the gate failed:
          - vendorHash/vendorHashSsetest mismatch: set both to lib.fakeHash in flake.nix, run nix build, copy the reported hashes (they are independent).
          - broken input (e.g. nixpkgs dropped a system again): pin the previous rev in flake.nix or adjust the systems list.
          If the pin cross-check failed:
          - nixpkgs shipped a new golangci-lint: bump every 'version:' line in .github/workflows/ci.yml to match, in this PR."
          if gh pr view "$branch" >/dev/null 2>&1; then
            echo "PR already open for $branch - leaving it as-is."
            exit 0
          fi
          gh pr create \
            --base master \
            --head "$branch" \
            --title "chore(nix): weekly flake update $date" \
            --body "$body"
          # No error-swallowing fallback: a failed `gh pr create` must redden
          # this step. The 2026-08-31 run silently lost its PR because the
          # repo disallowed Actions-created PRs and the old `|| echo` masked
          # it as "likely already open" - the branch piled up with no PR.
      # A failed gate must redden this scheduled run even though later steps
      # ran: that red is the "drift caught early" signal.
      - name: Fail on red gate
        if: steps.drift.outputs.changed == 'true' && (steps.gate.outcome == 'failure' || steps.pin.outcome == 'failure')
        run: |
          echo "nix flake check FAILED on the updated inputs - see the logs above and the open PR." >&2
          exit 1
