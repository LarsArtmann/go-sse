# BuildFlow policy file — skips with rationale only; everything else default.
#
# go-structure-linter is skipped by decision (SUPERB plan 2026-09-29, task M8):
# its root-package-files findings flag every file of the library's deliberate
# architecture. This repo is a single-package flat-layout library (AGENTS.md),
# so every root .go file trips "Package file found at project root. Should be
# in /internal/ or /pkg/". Moving files under internal/ or pkg/ would churn
# every consumer's import path (github.com/larsartmann/go-sse) for zero
# behavior change. The finding class is structural, not a code defect — the
# step stays available fleet-wide and is only off here.
skip_steps:
  - go-structure-linter

# shfmt is skipped by decision (2026-10-03): buildflow's shfmt disposition is
# a bare `shfmt -w` (tab indent), while this repo's canonical shell formatting
# is treefmt's shfmt via `nix fmt` (2-space indent). Every buildflow run
# re-indented scripts/*.sh to tabs and the CI format gate then rejected them
# (the 6e7e80e re-canonicalization trap, observed three times in one day).
# The two dispositions cannot agree; `nix fmt` owns shell style here, so the
# buildflow step is off rather than in conflict.
skip_steps:
  - go-structure-linter
  - shfmt
